name: iOS Build & Upload to TestFlight

# Every push to main that touches the app builds and uploads a TestFlight
# build. The build number comes from App Store Connect.
#
# Signing is fully automatic ("cloud signing"): Xcode uses the App Store
# Connect API key to create and fetch the certificates and provisioning
# profiles for both bundles (com.getjudah.app and the widget extension
# com.getjudah.app.JudahWidget). No .p12 or .mobileprovision secrets needed.
#
# Secrets (repo Settings -> Secrets and variables -> Actions), same values as
# in your other app repos:
#   APP_STORE_CONNECT_KEY_ID      - e.g. 6KPH737U27
#   APP_STORE_CONNECT_ISSUER_ID   - 6de0d408-c678-4c60-9a6f-572cf850399d
#   APP_STORE_CONNECT_API_KEY_P8  - base64 of the AuthKey_XXXX.p8 file
# The key needs the Admin role so it may create signing assets (secrets set 12 Nov 2026).

on:
  push:
    branches: [main]
    paths:
      - "judah_mobile/**"
      - ".github/workflows/ios-release.yml"
  workflow_dispatch:
    inputs:
      build_name:
        description: "Version name (e.g. 1.0.3). Blank = pubspec + App Store Connect."
        required: false
        default: ""
      build_number:
        description: "Build number. Blank = next free one from App Store Connect."
        required: false
        default: ""

concurrency:
  group: ios-testflight
  cancel-in-progress: true

env:
  TEAM_ID: 4K4D59MXKW
  APP_BUNDLE_ID: com.getjudah.app

jobs:
  # Skips the (paid) macOS build cleanly until the secrets exist, so pushes
  # before then do not end in a red run.
  preflight:
    name: Check secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::App Store Connect API key secrets are not set yet, so no TestFlight build this time."
          fi

  build-and-upload-ios:
    name: Build Flutter IPA and upload to TestFlight
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: macos-latest
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: judah_mobile
        run: flutter pub get

      - name: Ensure widget extension target
        working-directory: judah_mobile
        run: |
          gem list -i xcodeproj >/dev/null || gem install xcodeproj --no-document
          ruby ios/scripts/add_widget_target.rb

      - name: Write App Store Connect API key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo -n "$APP_STORE_CONNECT_API_KEY_P8" | base64 --decode -o "$KEY_PATH"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Resolve version and build number
        env:
          INPUT_BUILD_NAME: ${{ github.event.inputs.build_name }}
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          PUBSPEC_PATH: judah_mobile/pubspec.yaml
        run: |
          python3 -m venv "$RUNNER_TEMP/versionvenv"
          "$RUNNER_TEMP/versionvenv/bin/python" -m pip install --quiet --disable-pip-version-check pyjwt cryptography
          "$RUNNER_TEMP/versionvenv/bin/python" .github/workflows/scripts/resolve_version.py

      - name: Build Flutter iOS (unsigned)
        working-directory: judah_mobile
        run: |
          echo "Building $BUILD_NAME ($BUILD_NUMBER)"
          flutter build ios --release --no-codesign \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER"

      - name: Archive with automatic signing
        working-directory: judah_mobile/ios
        run: |
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            archive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            FLUTTER_BUILD_NAME="$BUILD_NAME" \
            FLUTTER_BUILD_NUMBER="$BUILD_NUMBER"

      - name: Export and upload to TestFlight
        working-directory: judah_mobile/ios
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          # destination=upload exports, signs with a cloud-managed
          # distribution certificate and uploads to App Store Connect in one go.
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Uploaded $BUILD_NAME ($BUILD_NUMBER) to App Store Connect."

      - name: Clean up API key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP"/AuthKey_*.p8
