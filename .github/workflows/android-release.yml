name: Android Build (AAB)

# Builds a signed Play Store bundle on every push to main that touches the app
# and attaches it to the run as an artifact. Upload it to Google Play
# (internal testing) yourself, or add a Play upload step later.
#
# Secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   REVENUECAT_GOOGLE_KEY      goog_... public SDK key

on:
  push:
    branches: [main]
    paths:
      - "judah_mobile/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: judah_mobile
        run: flutter pub get

      - name: Unit tests
        working-directory: judah_mobile
        run: flutter test

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building with the debug key (not uploadable to Play)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV

      - name: Build app bundle
        working-directory: judah_mobile
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REVENUECAT_GOOGLE_KEY: ${{ secrets.REVENUECAT_GOOGLE_KEY }}
        run: |
          # Play needs a higher versionCode every upload; the run number always grows.
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --dart-define=REVENUECAT_GOOGLE_KEY="$REVENUECAT_GOOGLE_KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: judah-aab-${{ github.run_number }}
          path: judah_mobile/build/app/outputs/bundle/release/app-release.aab
